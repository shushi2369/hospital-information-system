services:
  mysql:
    image: mysql:8.0.36
    container_name: his-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-his}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
    # 数据库/缓存只对本机回环开放（部署指南 §A：3306/6379 不对外）
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    healthcheck:
      # 口令走配置文件而非命令行（docker inspect 可见进程参数）
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --password=$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    container_name: his-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  minio:
    image: minio/minio:latest
    container_name: his-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # minioadmin 默认口令不可对外（.env 必须覆盖）
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?在 .env 中设置 MINIO_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: his-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-his}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:?在 .env 中设置 JWT_SECRET}
      AES_KEY: ${AES_KEY:?在 .env 中设置 AES_KEY}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/demo}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "8080:8080"

  nginx:
    image: nginx:1.25
    container_name: his-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-security-headers.inc:/etc/nginx/conf.d/security-headers.inc:ro
      - ../his-web/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data:
  redis-data:
  minio-data:
