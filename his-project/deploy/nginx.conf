server {
    listen 80;
    server_name _;
    # 不泄露 nginx 版本号（八十六轮安全审计：Server: nginx/1.24.0 是攻击面测绘信息）
    server_tokens off;

    # 响应头加固（《04》§6：CSP/X-Frame-Options/安全头）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    # gzip 压缩（前端主包与 API JSON 均受益）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 前端静态资源（his-web 构建产物）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # SPA 入口不缓存：try_files 回落与直接访问都命中此处，防前端部署后浏览器用旧 index.html
    # 注意：location 内一旦出现 add_header，server 级安全头不再继承，须逐 location 重复（include 复用片段）
    location = /index.html {
        root /usr/share/nginx/html;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
    }

    # 带哈希指纹的静态资源长缓存（脚本类资源同样需要 nosniff）
    location /assets/ {
        root /usr/share/nginx/html;
        include /etc/nginx/conf.d/security-headers.inc;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 反向代理后端 API
    location /api/ {
        include /etc/nginx/conf.d/security-headers.inc;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # OpenAPI 文档不对外代理（八十六轮审计：/v3/api-docs 匿名可达=全接口攻击面测绘图；
    # 后端 SWAGGER_ENABLED=false 双保险。内网排查时在本机直连 8080 查看）
    location ~ ^/(v3/api-docs|swagger-ui) {
        return 404;
    }
}
