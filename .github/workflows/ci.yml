name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: 后端编译与单测（70 项）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: his
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend tests (70 unit tests + Flyway migration)
        working-directory: his-project/his-backend
        run: mvn -B test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/his?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root123
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379

  frontend-build:
    name: 前端构建验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: his-project/his-web/package-lock.json
      - name: Install dependencies
        working-directory: his-project/his-web
        run: npm install
      - name: Build
        working-directory: his-project/his-web
        run: npm run build

  consistency-check:
    name: 数据一致性巡检（27 段孤儿引用）
    runs-on: ubuntu-latest
    needs: backend-test
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: his
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Start backend (Flyway migration) and wait for completion
        working-directory: his-project/his-backend
        run: |
          mvn -B spring-boot:run &
          # 本 job 无 Redis 服务，不能用登录接口探活；轮询"迁移文件数 == 已成功迁移数"（自维护，
          # 不再钉死单个版本号——88轮审计：钉 V37 会在 V38+ 未执行完时放行，巡检撞"表不存在"）
          EXPECTED=$(ls src/main/resources/db/migration/V*.sql | wc -l)
          for i in $(seq 1 60); do
            APPLIED=$(mysql -h 127.0.0.1 -uroot -proot123 his -N -e "SELECT COUNT(*) FROM flyway_schema_history WHERE success=1 AND script LIKE 'V%.sql'" 2>/dev/null || true)
            FAILED=$(mysql -h 127.0.0.1 -uroot -proot123 his -N -e "SELECT COUNT(*) FROM flyway_schema_history WHERE success=0" 2>/dev/null || true)
            if [ "${APPLIED:-0}" -ge "$EXPECTED" ] && [ "${FAILED:-0}" = "0" ]; then echo "flyway complete after ${i} polls"; break; fi
            sleep 3
          done
          APPLIED=$(mysql -h 127.0.0.1 -uroot -proot123 his -N -e "SELECT COUNT(*) FROM flyway_schema_history WHERE success=1 AND script LIKE 'V%.sql'" 2>/dev/null || true)
          FAILED=$(mysql -h 127.0.0.1 -uroot -proot123 his -N -e "SELECT COUNT(*) FROM flyway_schema_history WHERE success=0" 2>/dev/null || true)
          if [ "${APPLIED:-0}" -lt "$EXPECTED" ] || [ "${FAILED:-0}" != "0" ]; then echo "Flyway incomplete: applied=$APPLIED/$EXPECTED failed=$FAILED"; exit 1; fi
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/his?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root123
      - name: Run consistency check (75 segments, expect 0 violations)
        run: |
          mysql -h 127.0.0.1 -uroot -proot123 his < his-project/deploy/db/consistency_check.sql
        env:
          MYSQL_PWD: root123

  api-e2e:
    name: API e2e（九套 318 断言）+ 单测 70
    runs-on: ubuntu-latest
    needs: backend-test
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: his
        ports:
          - 3306:3306
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Start backend (Flyway migration + readiness probe)
        working-directory: his-project/his-backend
        run: |
          mvn -B spring-boot:run &
          PROBE='curl -sf -o /dev/null -X POST http://localhost:8080/api/v1/auth/login -H "Content-Type: application/json" -d "{\"username\":\"admin\",\"password\":\"His@2026\"}"'
          for i in $(seq 1 60); do
            if eval "$PROBE"; then echo "backend ready after ${i} polls"; break; fi
            sleep 3
          done
          eval "$PROBE"
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/his?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root123
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379
      - name: Load demo seed (minimal e2e dataset)
        run: |
          mysql -h 127.0.0.1 -uroot -proot123 his < his-project/deploy/db/ci_seed.sql
        env:
          MYSQL_PWD: root123
      - name: Run API e2e suites (318 assertions, fail-fast)
        run: |
          cd his-project/deploy/e2e
          for s in e2e_acceptance e2e_phase2 e2e_phase3 e2e_phase3b e2e_phase3c e2e_phase4 e2e_phase4b concurrency_test fix_regression; do
            echo "::group::$s"
            python3 "$s.py" || exit 1
            echo "::endgroup::"
          done
