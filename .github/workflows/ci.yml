name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: 后端编译与单测（65 项）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: his
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend tests (65 unit tests + Flyway migration)
        working-directory: his-project/his-backend
        run: mvn -B test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/his?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root123
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379

  frontend-build:
    name: 前端构建验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: his-project/his-web/package-lock.json
      - name: Install dependencies
        working-directory: his-project/his-web
        run: npm install
      - name: Build
        working-directory: his-project/his-web
        run: npm run build

  consistency-check:
    name: 数据一致性巡检（27 段孤儿引用）
    runs-on: ubuntu-latest
    needs: backend-test
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: his
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Start backend (Flyway migration + readiness probe)
        working-directory: his-project/his-backend
        run: |
          mvn -B spring-boot:run &
          PROBE='curl -sf -o /dev/null -X POST http://localhost:8080/api/v1/auth/login -H "Content-Type: application/json" -d "{\"username\":\"admin\",\"password\":\"His@2026\"}"'
          for i in $(seq 1 60); do
            if eval "$PROBE"; then echo "backend ready after ${i} polls"; break; fi
            sleep 3
          done
          eval "$PROBE"
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/his?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root123
      - name: Run consistency check (27 segments, expect 0 orphans)
        run: |
          mysql -h 127.0.0.1 -uroot -proot123 his < his-project/deploy/db/consistency_check.sql
        env:
          MYSQL_PWD: root123

  api-e2e:
    name: API e2e（九套 318 断言）
    runs-on: ubuntu-latest
    needs: backend-test
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: his
        ports:
          - 3306:3306
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Start backend (Flyway migration + readiness probe)
        working-directory: his-project/his-backend
        run: |
          mvn -B spring-boot:run &
          PROBE='curl -sf -o /dev/null -X POST http://localhost:8080/api/v1/auth/login -H "Content-Type: application/json" -d "{\"username\":\"admin\",\"password\":\"His@2026\"}"'
          for i in $(seq 1 60); do
            if eval "$PROBE"; then echo "backend ready after ${i} polls"; break; fi
            sleep 3
          done
          eval "$PROBE"
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/his?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root123
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379
      - name: Load demo seed (minimal e2e dataset)
        run: |
          mysql -h 127.0.0.1 -uroot -proot123 his < his-project/deploy/db/ci_seed.sql
        env:
          MYSQL_PWD: root123
      - name: Run API e2e suites (318 assertions, fail-fast)
        run: |
          cd his-project/deploy/e2e
          for s in e2e_acceptance e2e_phase2 e2e_phase3 e2e_phase3b e2e_phase3c e2e_phase4 e2e_phase4b concurrency_test fix_regression; do
            echo "::group::$s"
            python3 "$s.py" || exit 1
            echo "::endgroup::"
          done
