name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: 后端编译与单测
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: his
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 后端单元测试与数据库、Redis 会话回归
        working-directory: his-project/his-backend
        run: mvn -B test -Dhis.test.redis=true -Dhis.test.mysql=true -Dhis.test.mysql.server-url=jdbc:mysql://127.0.0.1:3306/
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/his?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root123
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379

  frontend-build:
    name: 前端构建验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: his-project/his-web/package-lock.json
      - name: Install dependencies
        working-directory: his-project/his-web
        run: npm install
      - name: 前端类型检查
        working-directory: his-project/his-web
        run: npm run typecheck
      - name: Build
        working-directory: his-project/his-web
        run: npm run build
      - name: 前端缺陷回归
        working-directory: his-project/his-web
        run: npm test

  consistency-check:
    name: 数据一致性巡检（所有查询均应返回 0 行）
    runs-on: ubuntu-latest
    needs: backend-test
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: his
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Start backend (Flyway migration) and wait for completion
        working-directory: his-project/his-backend
        run: |
          mvn -B spring-boot:run &
          # 默认加载正式与演示两个目录；只数正式迁移会在末尾迁移执行前提前放行。
          EXPECTED=$(find src/main/resources/db/migration src/main/resources/db/demo -maxdepth 1 -name 'V*.sql' | wc -l)
          for i in $(seq 1 60); do
            APPLIED=$(mysql -h 127.0.0.1 -uroot -proot123 his -N -e "SELECT COUNT(*) FROM flyway_schema_history WHERE success=1 AND script LIKE 'V%.sql'" 2>/dev/null || true)
            FAILED=$(mysql -h 127.0.0.1 -uroot -proot123 his -N -e "SELECT COUNT(*) FROM flyway_schema_history WHERE success=0" 2>/dev/null || true)
            if [ "${APPLIED:-0}" -ge "$EXPECTED" ] && [ "${FAILED:-0}" = "0" ]; then echo "flyway complete after ${i} polls"; break; fi
            sleep 3
          done
          APPLIED=$(mysql -h 127.0.0.1 -uroot -proot123 his -N -e "SELECT COUNT(*) FROM flyway_schema_history WHERE success=1 AND script LIKE 'V%.sql'" 2>/dev/null || true)
          FAILED=$(mysql -h 127.0.0.1 -uroot -proot123 his -N -e "SELECT COUNT(*) FROM flyway_schema_history WHERE success=0" 2>/dev/null || true)
          if [ "${APPLIED:-0}" -lt "$EXPECTED" ] || [ "${FAILED:-0}" != "0" ]; then echo "Flyway incomplete: applied=$APPLIED/$EXPECTED failed=$FAILED"; exit 1; fi
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/his?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root123
      - name: 数据一致性巡检（发现违规即失败）
        run: |
          # mysql 查询成功不代表数据无违规，必须检查实际返回行数。
          RESULT_FILE="$RUNNER_TEMP/一致性巡检结果.txt"
          mysql --batch --skip-column-names -h 127.0.0.1 -uroot his < his-project/deploy/db/consistency_check.sql > "$RESULT_FILE"
          if [ -s "$RESULT_FILE" ]; then
            cat "$RESULT_FILE"
            echo "数据一致性巡检失败：检测到违规记录"
            exit 1
          fi
          echo "数据一致性巡检通过：所有查询均返回 0 行"
        env:
          MYSQL_PWD: root123

  api-e2e:
    name: API e2e（十套）+ 单测
    runs-on: ubuntu-latest
    needs: backend-test
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: his
        ports:
          - 3306:3306
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Start backend (Flyway migration + readiness probe)
        working-directory: his-project/his-backend
        run: |
          mvn -B spring-boot:run &
          PROBE='curl -sf -o /dev/null -X POST http://localhost:8080/api/v1/auth/login -H "Content-Type: application/json" -d "{\"username\":\"admin\",\"password\":\"His@2026\"}"'
          for i in $(seq 1 60); do
            if eval "$PROBE"; then echo "backend ready after ${i} polls"; break; fi
            sleep 3
          done
          eval "$PROBE"
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/his?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root123
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379
      - name: Load demo seed (minimal e2e dataset)
        run: |
          mysql -h 127.0.0.1 -uroot -proot123 his < his-project/deploy/db/ci_seed.sql
        env:
          MYSQL_PWD: root123
      - name: Run API e2e suites (363 assertions, fail-fast)
        run: |
          cd his-project/deploy/e2e
          for s in e2e_acceptance e2e_phase2 e2e_phase3 e2e_phase3b e2e_phase3c e2e_phase4 e2e_phase4b e2e_phase5 concurrency_test fix_regression; do
            echo "::group::$s"
            python3 "$s.py" || exit 1
            echo "::endgroup::"
          done
          python3 会话安全回归.py
